<app-auth-page-layout>
  @if (status() === 'error') {
    <div class="app-login__error flex items-center gap-2 mb-5" data-testid="login-error-message">
      <mat-icon>error_outline</mat-icon>
      <span class="mat-body-medium">{{ errorMessage() }}</span>
    </div>
  }
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5"
        i18n-aria-label="Login|Form aria-label@@login.form.ariaLabel"
        aria-label="Sign in">
    <app-form-input [config]="emailFieldConfig" [control]="form.controls.email" testId="login-email-input" />
    <app-form-input [config]="passwordFieldConfig()" [control]="form.controls.password" testId="login-password-input" />
    <div class="flex items-center justify-between -mt-7">
      <app-checkbox [(checked)]="rememberMe"
                    i18n-ariaLabel="Login|Remember me aria@@login.rememberMe.ariaLabel"
                    ariaLabel="Remember me">
        <span class="mat-label-medium"
              i18n="Login|Remember me label@@login.rememberMe.label">Remember me</span>
      </app-checkbox>
      <a routerLink="/auth/forgot-password" class="app-login__link mat-label-medium"
         i18n="Login|Forgot password link@@login.forgotPassword.link">Forgot password?</a>
    </div>
    <div class="w-full">
      <app-button
        type="submit"
        [disabled]="isLoading()"
        [iconBefore]="isLoading() ? 'hourglass_empty' : 'login'"
        testId="login-submit-button"
        class="app-login__submit-btn"
      >
        <ng-container i18n="Login|Submit button@@login.btn.submit">Sign In</ng-container>
      </app-button>
    </div>
    <div class="app-login__divider flex items-center gap-3">
      <mat-divider class="app-login__divider-line flex-1"></mat-divider>
      <span class="mat-body-small app-login__divider-text"
            i18n="Login|Divider OR label@@login.divider.or">OR</span>
      <mat-divider class="app-login__divider-line flex-1"></mat-divider>
    </div>

    <div class="w-full">
      <app-button
        variant="tonal"
        (click)="onGoogleLogin()"
        class="app-login__submit-btn"
        i18n-aria-label="Login|Google login aria-label@@login.google.ariaLabel"
        aria-label="Connect with Google"
      >
        <span class="app-login__google-btn-content">
          <mat-icon svgIcon="google" class="app-login__google-icon" aria-hidden="true"></mat-icon>
          <span i18n="Login|Google login button@@login.google.btn">Connect with Google</span>
        </span>
      </app-button>
    </div>

    <p class="m-0 flex items-center justify-center gap-1">
      <span class="mat-label-medium" i18n="Login|Register link text@@login.register.text">Don't have an account yet?</span>
      <a routerLink="/auth/register" class="app-login__link mat-label-medium" i18n="Login|Register link@@login.register.link">Sign Up!</a>
    </p>
  </form>
</app-auth-page-layout>
