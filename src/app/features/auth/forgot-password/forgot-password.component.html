<app-auth-layout>
  <div class="flex flex-col items-center gap-2 mb-8">
    <mat-icon class="app-forgot-password__logo" color="primary">lock_reset</mat-icon>
    <h1 class="mat-headline-medium m-0" i18n="ForgotPassword|Page heading@@forgot.heading">Forgot your password?</h1>
    <p class="mat-body-medium m-0 text-center" i18n="ForgotPassword|Page subheading@@forgot.subheading">Enter your email and we'll send you a reset link</p>
  </div>

  @if (status() === 'error') {
    <div class="app-forgot-password__error flex items-center gap-2 mb-4">
      <mat-icon>error_outline</mat-icon>
      <span class="mat-body-medium">{{ errorMessage() }}</span>
    </div>
  }

  @if (isSuccess()) {
    <div class="app-forgot-password__success flex items-center gap-2 mb-4">
      <mat-icon>check_circle_outline</mat-icon>
      <span class="mat-body-medium" i18n="ForgotPassword|Success message@@forgot.success">Check your inbox — a reset link is on its way.</span>
    </div>
  }

  @if (!isSuccess()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <app-form-input
        [control]="form.controls.email"
        [config]="emailFieldConfig"
      />

      <app-button
        variant="filled"
        color="primary"
        type="submit"
        class="w-full"
        [disabled]="isLoading()"
      >
        <ng-container i18n="ForgotPassword|Submit button@@forgot.btn.submit">Send reset link</ng-container>
      </app-button>
    </form>
  }

  <p class="mat-body-small m-0 text-center mt-4">
    <a routerLink="/auth/login" class="app-forgot-password__link" i18n="ForgotPassword|Back to login@@forgot.login.link">Back to sign in</a>
  </p>
</app-auth-layout>
