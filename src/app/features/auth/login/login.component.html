<div class="app-login__wrapper">

  <!-- Brand header -->
  <div class="app-login__header">
    <div class="app-login__header-inner flex items-end justify-between">

      <!-- Brand -->
      <div class="app-login__brand flex flex-col items-start pb-4 pl-8">
        <span class="app-login__brand-name">admin</span>
        <span class="app-login__brand-sub mat-body-medium"
          i18n="Login|Brand subtitle@@login.brand.subtitle">panel</span>
      </div>

      <!-- Elevated SIGN IN tab -->
      <div class="app-login__signin-tab flex items-center gap-2">
        <mat-icon class="app-login__header-icon">account_circle</mat-icon>
        <span class="app-login__header-label mat-label-large"
          i18n="Login|Header sign in label@@login.header.signin">SIGN IN</span>
      </div>

    </div>
    <!-- Accent bottom border -->
    <div class="app-login__header-accent"></div>
  </div>

  <!-- Card body -->
  <div class="app-login__card">

    @if (status() === 'error') {
      <div class="app-login__error flex items-center gap-2 mb-5">
        <mat-icon>error_outline</mat-icon>
        <span class="mat-body-medium">{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

      <!-- Email -->
      <app-form-input
        formControlName="email"
        appFormInputConnector
        [config]="emailFieldConfig"
      />

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="mat-label-medium app-login__field-label"
            i18n="Login|Password field label@@login.field.password.label">Password</span>
          <a routerLink="/auth/forgot-password"
            class="app-login__link mat-body-small"
            i18n="Login|Forgot password link@@login.forgot.link">Lost Password?</a>
        </div>
        <app-form-input
          formControlName="password"
          appFormInputConnector
          [config]="passwordFieldConfig()"
        />
      </div>

      <!-- Show password + Sign In -->
      <div class="flex items-center justify-between">
        <app-checkbox
          [checked]="showPassword()"
          (changed)="onShowPasswordChange($event)"
          ariaLabel="Show password"
          i18n-ariaLabel="Login|Show password checkbox aria-label@@login.field.password.checkbox.ariaLabel"
        >
          <span class="mat-body-medium"
            i18n="Login|Show password checkbox label@@login.field.password.checkbox.label">
            Show password
          </span>
        </app-checkbox>

        <app-button
          variant="filled"
          color="primary"
          type="submit"
          [disabled]="isLoading()"
          [iconBefore]="isLoading() ? 'hourglass_empty' : 'login'"
        >
          <ng-container i18n="Login|Submit button@@login.btn.submit">Sign In</ng-container>
        </app-button>
      </div>

      <!-- OR divider -->
      <div class="app-login__divider flex items-center gap-3">
        <span class="app-login__divider-line flex-1"></span>
        <span class="mat-body-small app-login__divider-text"
          i18n="Login|Divider OR label@@login.divider.or">OR</span>
        <span class="app-login__divider-line flex-1"></span>
      </div>

      <!-- Google social login -->
      <button
        type="button"
        class="app-login__social-btn"
        (click)="onGoogleLogin()"
        [disabled]="isLoading()"
        i18n-aria-label="Login|Google login aria-label@@login.google.ariaLabel"
        aria-label="Connect with Google">
        <svg class="app-login__google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="mat-label-large"
          i18n="Login|Google login button@@login.google.btn">Connect with Google</span>
      </button>

      <!-- Register link -->
      <p class="mat-body-small m-0 text-center">
        <span i18n="Login|Register link text@@login.register.text">Don't have an account yet?</span>
        &nbsp;
        <a routerLink="/auth/register" class="app-login__link"
          i18n="Login|Register link@@login.register.link">Sign Up!</a>
      </p>

    </form>
  </div>
</div>
