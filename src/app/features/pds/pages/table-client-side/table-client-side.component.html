<div class="pds-page">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="mat-headline-large">Directorio de empleados</h1>
      <p class="mat-body-medium">Ejemplo de tabla client-side con filtros simples y avanzados</p>
    </div>

    <app-toggle-group
      [options]="filterModeOptions"
      [(value)]="filterModeValue">
    </app-toggle-group>
  </div>

  <app-table-client-side
    [data]="employees()"
    [tableConfig]="tableConfig"
    [filtersConfig]="filtersConfig()"
    [useAdvancedFilters]="useAdvancedFilters()"
    (actionClick)="onActionClick($event)"
    (filtersChange)="onFiltersChange($event)"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)">
    <ng-template #cellTemplate let-column="column" let-row let-value="value">
      @switch (column.key) {
        @case ('statusLabel') {
          <span [class]="'badge--' + row.status" class="badge">
            {{ value }}
          </span>
        }
        @case ('salaryFormatted') {
          <span class="salary">{{ value }}</span>
        }
        @default {
          {{ value }}
        }
      }
    </ng-template>
  </app-table-client-side>
</div>
