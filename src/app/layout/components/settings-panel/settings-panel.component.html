<div class="flex flex-col h-full">
  <div class="settings-header flex items-center justify-between px-6 py-4">
    <h2 class="settings-title mat-title-large m-0" i18n="Settings|Settings panel title@@settings.title">Settings</h2>
    <button
      (click)="closePanel()"
      aria-label="Close settings"
      i18n-aria-label="Settings|Button to close the settings panel@@settings.btn.close"
      mat-icon-button>
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="main-content flex-1 overflow-y-auto p-6">
    <div class="mb-8">
      <h3 class="section-label mat-label-large m-0 mb-4" i18n="Settings|Mode section@@settings.scheme.title">Mode</h3>
      <app-toggle-group
        [options]="schemeOptions"
        [value]="config().scheme"
        ariaLabel="Display mode"
        class="w-full"
        (changed)="selectScheme($event)">
      </app-toggle-group>
    </div>

    <div class="mb-8">
      <h3 class="section-label mat-label-large m-0 mb-4" i18n="Settings|Accent color section@@settings.theme.title">Accent Color</h3>
      <div class="flex gap-3 flex-wrap">
        @for (theme of themes; track theme.id) {
          <button
            (click)="selectTheme(theme.id)"
            [attr.aria-label]="theme.label"
            [class.active]="isThemeActive()(theme.id)"
            [matTooltip]="theme.label"
            class="theme-color-button"
            matTooltipPosition="above">
            <span [style.background-color]="theme.color_primary" class="theme-primary-preview"></span>
            <span [style.background-color]="theme.color_tertiary" class="theme-accent-preview"></span>
            @if (isThemeActive()(theme.id)) {
              <mat-icon class="theme-check-icon">check</mat-icon>
            }
          </button>
        }
      </div>
    </div>
  </div>
  <div class="settings-footer px-6 py-4">
    <button
      (click)="resetSettings()"
      class="w-full"
      matButton="tonal">
      <ng-container i18n="Settings|Button to reset settings@@settings.btn.reset">Reset to defaults</ng-container>
    </button>
  </div>
</div>
