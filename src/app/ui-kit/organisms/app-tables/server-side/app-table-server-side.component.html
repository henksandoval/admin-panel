<div class="app-server-side-table">
  @if (filtersConfig(); as config) {
    @if (useAdvancedFilters()) {
      <app-card
        [expanded]="false"
        [isExpandable]="true"
        class="mb-4"
        icon="filter_alt"
        [title]="advancedFiltersTitle">
        <app-filters-advanced
          (criteriaChange)="onFiltersChange($event)"
          [config]="config">
        </app-filters-advanced>
      </app-card>
    } @else {
      <app-simple-filters
        (criteriaChange)="onFiltersChange($event)"
        [config]="config">
      </app-simple-filters>
    }
  }

  <app-table
    (actionClick)="actionClick.emit($event)"
    (rowClick)="rowClick.emit($event)"
    (sortChange)="onSortChange($event)"
    [cellTemplateRef]="projectedCellTemplate()"
    [config]="tableConfig()"
    [data]="data()"
    [loading]="loading()"
    [sort]="currentSort()">
    <ng-content select="[cellTemplate]"/>
  </app-table>

  @if (showPagination()) {
    <app-pagination
      (pageChange)="onPageChange($event)"
      [config]="paginationConfig() ?? {}"
      [state]="paginationState()">
    </app-pagination>
  }
</div>
