<nav class="app-bread-crumb mat-label-large">
  @for (item of items(); track item.label; let last = $last) {
    @if (last || !item.route) {
      <a class="app-bread-crumb-pill no-route" data-testid="bread-crumb-pill">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    } @else {
      <a [routerLink]="item.route" class="app-bread-crumb-pill" data-testid="bread-crumb-pill">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
    @if (!last) {
      <mat-icon aria-hidden="true" class="app-bread-crumb-separator" data-testid="bread-crumb-separator">chevron_right
      </mat-icon>
    }
  }
</nav>
