<div class="app-pagination-container">
    @if (showPageSizeSelector()) {
    <div class="app-pagination-size-selector">
        <span class="app-pagination-size-label mat-label-large">{{ itemsPerPageLabel() }}</span>
        <app-form-select
            class="app-pagination-size-select"
            [control]="pageSizeControl"
            [config]="{ density: -3 }"
            [options]="pageSizeSelectOptions()">
        </app-form-select>
    </div>
    }

    <div class="app-pagination-range-info mat-label-large">{{ rangeLabel() }}</div>

    <div class="app-pagination-nav">
    @if (showFirstLastButtons()) {
        <app-button
        [disabled]="isFirstPage()"
        [matTooltip]="firstPageLabel()"
        (click)="goToFirstPage()"
        iconBefore="first_page">
        </app-button>
    }

    <app-button
        [disabled]="isFirstPage()"
        [matTooltip]="previousPageLabel()"
        (click)="goToPreviousPage()"
        iconBefore="chevron_left">
    </app-button>

    <app-button
        [disabled]="isLastPage()"
        [matTooltip]="nextPageLabel()"
        (click)="goToNextPage()"
        iconBefore="chevron_right">
    </app-button>

    @if (showFirstLastButtons()) {
        <app-button
        [disabled]="isLastPage()"
        [matTooltip]="lastPageLabel()"
        (click)="goToLastPage()"
        iconBefore="last_page">
        </app-button>
    }
    </div>
</div>
